<title>우리집 보드게임</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap">
<style>
  /* 레이아웃: 한 화면 게임판 — 위 상대 줄, 가운데 판(덱·버림더미), 아래 내 패와 행동 버튼 */
  :root {
    --night: #1c1a3a;      /* 밤하늘 남색 배경 */
    --night-2: #262352;    /* 판 표면 */
    --line: #3b3770;
    --hanji: #f3ead6;      /* 한지 카드 앞면 */
    --ink: #22203a;        /* 먹색 글씨 */
    --persimmon: #f07a3e;  /* 감 주황: 강조 */
    --jade: #48b89e;       /* 비취: 내 차례/성공 */
    --plum: #c45a7a;       /* 자두: 경고 */
    --moon: #ffd76a;       /* 달빛: 특수 카드 */
    --muted: #a7a2cf;
    --fg: #f4f1ff;
    --f-display: 'Black Han Sans', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --f-body: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--night); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #app { max-width: 560px; margin: 0 auto; padding-block: 12px 24px; }
  h1, h2, h3, .display { font-family: var(--f-display); font-weight: 400; letter-spacing: .5px; text-wrap: balance; margin: 0; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--moon); outline-offset: 2px; }
  button:disabled { cursor: not-allowed; opacity: .45; }
  input { font: inherit; color: var(--ink); background: var(--hanji); border: 0; border-radius: 10px; padding: 10px 12px; width: 100%; box-sizing: border-box; }
  .row { display: flex; gap: 8px; align-items: center; }
  .stack { display: grid; gap: 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }

  .btn { padding: 12px 16px; border-radius: 12px; background: var(--night-2); border: 1px solid var(--line); font-weight: 700; }
  .btn.primary { background: var(--persimmon); border-color: var(--persimmon); color: #2a1206; }
  .btn.jade { background: var(--jade); border-color: var(--jade); color: #06231c; }
  .btn.ghost { background: transparent; }
  .btn.sm { padding: 7px 11px; font-size: 13px; border-radius: 10px; }

  header.top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 14px; }
  header.top h1 { font-size: 24px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--night-2); border: 1px solid var(--line); font-size: 13px; }
  .chip b { font-family: var(--f-display); font-weight: 400; letter-spacing: 2px; color: var(--moon); }

  /* 허브 */
  .game-tile { display: grid; grid-template-columns: 88px 1fr; gap: 14px; padding: 14px; border-radius: 16px; background: var(--night-2); border: 1px solid var(--line); text-align: left; width: 100%; }
  .game-tile .art { height: 88px; border-radius: 12px; background: radial-gradient(circle at 30% 30%, #3d3780, #1c1a3a); display: grid; place-items: center; }
  .game-tile h2 { font-size: 20px; }
  .room-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: var(--night-2); border: 1px solid var(--line); }

  /* 카드 */
  .card { --w: 58px; width: var(--w); aspect-ratio: 5/7; max-width: 100%; border-radius: 9px; position: relative; flex: 0 0 auto;
    transition: transform .25s ease, box-shadow .2s; display: grid; place-items: center; user-select: none; }
  .card.back { background:
      radial-gradient(circle at 50% 50%, transparent 0 14px, rgba(255,215,106,.25) 15px 16px, transparent 17px),
      repeating-linear-gradient(45deg, #3a2f78 0 6px, #332a6b 6px 12px);
    border: 2px solid #5b4fb0; }
  .card:disabled { opacity: 1; cursor: default; }
  .card.face { background: var(--hanji); color: var(--ink); border: 2px solid #d9cba8; }
  .card.face.special { border-color: var(--moon); box-shadow: inset 0 0 0 2px rgba(240,122,62,.35); }
  .card .num { font-family: var(--f-display); font-size: calc(var(--w) * .46); line-height: 1; }
  .card .lbl { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; font-size: calc(var(--w) * .16); font-weight: 700; color: #6b4b20; }
  .card .corner { position: absolute; top: 3px; left: 5px; font-family: var(--f-display); font-size: calc(var(--w) * .2); }
  .card.neg .num { color: #2a7a64; } .card.big .num { color: #b23a52; }
  .card.selectable { cursor: pointer; box-shadow: 0 0 0 3px var(--jade); }
  .card.selected { transform: translateY(-8px); box-shadow: 0 0 0 3px var(--moon); }
  .card.flash { animation: flash .6s ease; }
  @keyframes flash { 0% { transform: rotateY(90deg); } 100% { transform: rotateY(0); } }
  .card.lg { --w: 92px; }
  .card.sm { --w: 34px; border-width: 1.5px; border-radius: 6px; }

  /* 게임판 */
  .opps { display: grid; gap: 8px; }
  .opp { padding: 8px 10px; border-radius: 12px; background: var(--night-2); border: 1px solid var(--line); }
  .opp.turn { border-color: var(--persimmon); box-shadow: 0 0 0 1px var(--persimmon); }
  .opp .name { font-weight: 700; display: flex; gap: 6px; align-items: center; min-width: 0; }
  .opp .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cards-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .table { display: flex; justify-content: center; align-items: center; gap: 18px; padding: 16px 8px; margin: 12px 0; border-radius: 18px;
    background: radial-gradient(ellipse at center, #2f2b63 0%, var(--night) 75%); border: 1px solid var(--line); flex-wrap: wrap; }
  .pile { display: grid; justify-items: center; gap: 4px; }
  .pile .cap { font-size: 12px; color: var(--muted); }
  .me { padding: 12px; border-radius: 16px; background: var(--night-2); border: 1px solid var(--line); }
  .me.turn { border-color: var(--jade); box-shadow: 0 0 0 1px var(--jade); }
  .me .cards-row { gap: 8px; justify-content: center; }
  .me .card { --w: 64px; }
  .status { text-align: center; font-weight: 700; padding: 10px; border-radius: 12px; background: rgba(255,215,106,.08); border: 1px dashed rgba(255,215,106,.35); color: var(--moon); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .actions .wide { grid-column: 1 / -1; }
  .log { margin-top: 12px; font-size: 13px; color: var(--muted); display: grid; gap: 3px; }
  .log div:first-child { color: var(--fg); }
  .score { font-variant-numeric: tabular-nums; color: var(--moon); font-family: var(--f-display); }

  .overlay { position: fixed; inset: 0; background: rgba(12,10,30,.82); display: grid; place-items: center; z-index: 30;
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .sheet { background: var(--night-2); border: 1px solid var(--line); border-radius: 18px; padding: 20px; width: 100%; max-width: 440px; max-height: 88vh; overflow-y: auto; box-sizing: border-box; }
  .sheet h2 { font-size: 22px; margin-bottom: 8px; }
  .rules h3 { font-size: 17px; margin: 16px 0 6px; color: var(--moon); }
  .rules p, .rules li { color: #ddd8f5; }
  .rules ul { padding-left: 20px; margin: 6px 0; }
  .legend { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; }
  table.result { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  table.result td, table.result th { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; }
  table.result th { color: var(--muted); font-weight: 400; font-size: 13px; }
  .toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #0e0c22; color: var(--fg);
    border: 1px solid var(--line); padding: 10px 16px; border-radius: 999px; z-index: 40; max-width: calc(100% - 32px); text-align: center; }
  @media (prefers-reduced-motion: reduce) { .card, .card.flash { transition: none; animation: none; } }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>

<script>
/* =====================================================================
   도깨비 셈 — 규칙 엔진 (순수 함수: 상태 → 새 상태)
   ===================================================================== */
const DOK = (() => {
  const KINDS = {
    n:     { label: '' },
    gold:  { v: -3, name: '금방망이', label: '금방망이', desc: '가장 좋은 카드 (−3점)' },
    lamp:  { v: 5,  name: '등불',     label: '등불',     desc: '버리면: 내 카드 1장 몰래 보기', ability: 'peekSelf' },
    eye:   { v: 6,  name: '도깨비 눈', label: '도깨비 눈', desc: '버리면: 다른 사람 카드 1장 몰래 보기', ability: 'peekOther' },
    swap:  { v: 8,  name: '바꿔치기', label: '바꿔치기', desc: '버리면: 내 카드 1장과 다른 사람 카드 1장을 안 보고 맞바꾸기', ability: 'swap' },
    boss:  { v: 12, name: '대장 도깨비', label: '대장', desc: '가장 나쁜 카드 (12점)' },
  };
  const HAND = 4, MAX_HAND = 6, GOAL = 50, CALL_PENALTY = 10;

  function makeCards() {
    const cards = {}; let i = 0;
    const add = (k, v) => { cards['c' + (i++)] = { k, v }; };
    for (let c = 0; c < 4; c++) add('n', 0);
    for (let v = 1; v <= 9; v++) for (let c = 0; c < 5; c++) add('n', v);
    ['gold', 'gold', 'lamp', 'lamp', 'lamp', 'eye', 'eye', 'eye', 'swap', 'swap', 'swap', 'boss', 'boss'].forEach(k => add(k, KINDS[k].v));
    return cards;
  }
  const shuffle = (a, rnd = Math.random) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const clone = s => JSON.parse(JSON.stringify(s));
  const idxOf = (s, pid) => s.players.findIndex(p => p.id === pid);
  const cur = s => s.players[s.turn].id;
  const handSum = (s, pid) => (s.hands[pid] || []).reduce((t, c) => t + s.cards[c].v, 0);
  const log = (s, who, text) => { s.log = [{ who, text, at: s.ver }].concat(s.log || []).slice(0, 8); };

  function drawFromDeck(s) {
    if (!s.deck.length) {
      const top = s.discard.pop();
      s.deck = shuffle(s.discard); s.discard = top ? [top] : [];
      if (s.deck.length) log(s, null, '덱이 떨어져 버림더미를 섞었어요');
    }
    return s.deck.pop() || null;
  }

  function newRound(s, rnd) {
    s = clone(s);
    s.cards = s.cards || makeCards();
    s.deck = shuffle(Object.keys(s.cards), rnd); s.discard = []; s.hands = {};
    s.players.forEach(p => { s.hands[p.id] = s.deck.splice(-HAND); });
    s.discard.push(s.deck.pop());
    s.round = (s.round || 0) + 1;
    s.turn = (s.round - 1) % s.players.length;
    s.caller = null; s.pending = null; s.ability = null; s.reveal = null; s.result = null; s.turnsPlayed = 0;
    s.status = 'play';
    s.scores = s.scores || Object.fromEntries(s.players.map(p => [p.id, 0]));
    log(s, null, `${s.round}라운드 시작! 처음 받은 카드 중 왼쪽 2장을 확인하세요`);
    return s;
  }

  function endTurn(s) {
    s.pending = null; s.ability = null; s.turnsPlayed++;
    s.turn = (s.turn + 1) % s.players.length;
    if (s.caller && cur(s) === s.caller) return scoreRound(s);
    return s;
  }

  function scoreRound(s) {
    const sums = Object.fromEntries(s.players.map(p => [p.id, handSum(s, p.id)]));
    const min = Math.min(...Object.values(sums));
    const add = {};
    s.players.forEach(p => {
      if (p.id === s.caller) add[p.id] = sums[p.id] <= min ? 0 : sums[p.id] + CALL_PENALTY;
      else add[p.id] = sums[p.id];
    });
    s.players.forEach(p => { s.scores[p.id] += add[p.id]; });
    const over = Object.values(s.scores).some(v => v >= GOAL);
    s.result = { sums, add, callerWon: s.caller ? sums[s.caller] <= min : null, over };
    s.status = over ? 'gameEnd' : 'roundEnd';
    log(s, null, over ? '게임 끝!' : `${s.round}라운드 끝`);
    return s;
  }

  // 모든 행동: (상태, 행동자, 인자) → 새 상태. 규칙 위반이면 Error(한국어 메시지)
  function act(state, pid, type, a = {}) {
    const s = clone(state);
    const mine = () => { if (s.status !== 'play') throw Error('지금은 게임 중이 아니에요'); if (cur(s) !== pid) throw Error('내 차례가 아니에요'); };
    const hand = s.hands[pid];
    switch (type) {
      case 'draw': {
        mine(); if (s.pending || s.ability) throw Error('이미 카드를 가지고 있어요');
        const c = drawFromDeck(s); if (!c) return scoreRound(s);
        s.pending = { card: c, from: 'deck' }; log(s, pid, '덱에서 카드를 뽑았어요'); return s;
      }
      case 'takeDiscard': {
        mine(); if (s.pending || s.ability) throw Error('이미 카드를 가지고 있어요');
        if (!s.discard.length) throw Error('버림더미가 비어 있어요');
        if (!hand.length) throw Error('카드가 없으면 버림더미를 가져올 수 없어요. 덱에서 뽑으세요');
        s.pending = { card: s.discard.pop(), from: 'discard' }; log(s, pid, '버림더미 카드를 가져왔어요'); return s;
      }
      case 'swapPending': {
        mine(); if (!s.pending) throw Error('먼저 카드를 가져오세요');
        const i = a.idx; if (!(i >= 0 && i < hand.length)) throw Error('바꿀 카드를 고르세요');
        const old = hand[i]; hand[i] = s.pending.card; s.discard.push(old);
        log(s, pid, `${i + 1}번 카드를 바꾸고 ${cardName(s.cards[old])}${eul(s.cards[old])} 버렸어요`);
        return endTurn(s);
      }
      case 'discardPending': {
        mine(); if (!s.pending) throw Error('먼저 카드를 가져오세요');
        if (s.pending.from === 'discard') throw Error('버림더미에서 가져온 카드는 바꿔야 해요');
        const c = s.pending.card, kind = KINDS[s.cards[c].k]; s.discard.push(c); s.pending = null;
        if (a.useAbility && kind.ability) {
          if (kind.ability !== 'peekSelf' && s.players.length < 2) throw Error('상대가 없어요');
          s.ability = { type: kind.ability }; log(s, pid, `${kind.name} 능력을 써요`); return s;
        }
        log(s, pid, `${cardName(s.cards[c])}${eul(s.cards[c])} 버렸어요`); return endTurn(s);
      }
      case 'peekSelf': {
        mine(); if (!s.ability || s.ability.type !== 'peekSelf') throw Error('등불 능력이 없어요');
        if (!(a.idx >= 0 && a.idx < hand.length)) throw Error('볼 카드를 고르세요');
        log(s, pid, `자기 ${a.idx + 1}번 카드를 몰래 봤어요`); return endTurn(s);
      }
      case 'peekOther': {
        mine(); if (!s.ability || s.ability.type !== 'peekOther') throw Error('도깨비 눈 능력이 없어요');
        const th = s.hands[a.target]; if (!th || a.target === pid || !(a.idx >= 0 && a.idx < th.length)) throw Error('다른 사람 카드를 고르세요');
        log(s, pid, `{${a.target}}의 ${a.idx + 1}번 카드를 몰래 봤어요`); return endTurn(s);
      }
      case 'swapCards': {
        mine(); if (!s.ability || s.ability.type !== 'swap') throw Error('바꿔치기 능력이 없어요');
        const th = s.hands[a.target]; if (!th || a.target === pid) throw Error('다른 사람 카드를 고르세요');
        if (!(a.myIdx >= 0 && a.myIdx < hand.length && a.idx >= 0 && a.idx < th.length)) throw Error('바꿀 카드 두 장을 고르세요');
        [hand[a.myIdx], th[a.idx]] = [th[a.idx], hand[a.myIdx]];
        log(s, pid, `자기 ${a.myIdx + 1}번 카드와 {${a.target}}의 ${a.idx + 1}번 카드를 맞바꿨어요`); return endTurn(s);
      }
      case 'skipAbility': {
        mine(); if (!s.ability) throw Error('쓸 능력이 없어요');
        log(s, pid, '능력을 쓰지 않았어요'); return endTurn(s);
      }
      case 'pair': {
        mine(); if (s.pending || s.ability) throw Error('지금은 짝 버리기를 할 수 없어요');
        const [i, j] = a.idx || []; if (i === j || !(i >= 0 && i < hand.length && j >= 0 && j < hand.length)) throw Error('내 카드 두 장을 고르세요');
        const ci = hand[i], cj = hand[j], vi = s.cards[ci].v, vj = s.cards[cj].v;
        s.reveal = { pid, cards: [ci, cj], ok: vi === vj, at: s.ver + 1 };
        if (vi === vj) {
          [i, j].sort((x, y) => y - x).forEach(k => hand.splice(k, 1)); s.discard.push(ci, cj);
          log(s, pid, `짝 버리기 성공! ${vi}점 두 장을 버렸어요`);
        } else {
          const pen = hand.length < MAX_HAND ? drawFromDeck(s) : null; if (pen) hand.push(pen);
          log(s, pid, `짝 버리기 실패 (${vi}, ${vj})${pen ? ' — 벌칙 카드 1장' : ''}`);
        }
        return endTurn(s);
      }
      case 'call': {
        mine(); if (s.pending || s.ability) throw Error('지금은 셈을 외칠 수 없어요');
        if (s.caller) throw Error('이미 누군가 셈을 외쳤어요');
        if (s.turnsPlayed < s.players.length) throw Error('한 바퀴 돈 뒤부터 외칠 수 있어요');
        s.caller = pid; log(s, pid, '"셈!"을 외쳤어요. 나머지는 한 번씩만 더!'); return endTurn(s);
      }
      default: throw Error('알 수 없는 행동');
    }
  }
  const cardName = c => c.k === 'n' ? `${c.v}` : `${KINDS[c.k].name}(${c.v})`;
  // 숫자 읽기 끝소리로 을/를 고르기 (0영 1일 3삼 6육 7칠 8팔 → 을)
  const eul = c => [0, 1, 3, 6, 7, 8].includes(Math.abs(c.v) % 10) ? '을' : '를';
  return { KINDS, HAND, GOAL, CALL_PENALTY, makeCards, newRound, act, handSum, cardName, cur, idxOf, shuffle };
})();
</script>

<script>
/* =====================================================================
   화면 (React + htm) — 공유 저장소(db)로 여러 폰이 같은 방을 봄
   ===================================================================== */
const { useState, useEffect, useRef, useMemo, useCallback } = React;
// htm 템플릿의 style="..." 문자열·class 속성을 React 형식으로 변환
const toStyle = str => Object.fromEntries(str.split(';').map(d => d.trim()).filter(Boolean).map(d => {
  const i = d.indexOf(':'); const k = d.slice(0, i).trim(); return [k.startsWith('--') ? k : k.replace(/-([a-z])/g, (_, c) => c.toUpperCase()), d.slice(i + 1).trim()]; }));
const h = (type, props, ...kids) => {
  if (props) {
    if (typeof props.style === 'string') props = { ...props, style: toStyle(props.style) };
    if ('class' in props) { const { class: c, ...rest } = props; props = { ...rest, className: c }; }
  }
  return React.createElement(type, props, ...kids);
};
const html = htm.bind(h);
const GAMES = [{ id: 'dokkaebi', name: '도깨비 셈', who: '2~6명 · 15분', blurb: '뒤집힌 카드를 기억하고 바꿔치기해서 합계를 가장 낮게 만드는 눈치 카드게임' }];
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const codeGen = () => Array.from({ length: 4 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random() * 24)]).join('');

function Card({ c, cards, hidden, size, onClick, selectable, selected, flash }) {
  if (!c || hidden) return html`<button type="button" class=${'card back ' + (size || '') + (selectable ? ' selectable' : '') + (selected ? ' selected' : '')}
      onClick=${onClick} disabled=${!onClick} aria-label="뒤집힌 카드"></button>`;
  const d = cards[c], kind = DOK.KINDS[d.k];
  const cls = ['card face', size || '', d.k !== 'n' ? 'special' : '', d.v < 0 ? 'neg' : '', d.v >= 12 ? 'big' : '', selectable ? 'selectable' : '', selected ? 'selected' : '', flash ? 'flash' : ''].join(' ');
  return html`<button type="button" class=${cls} onClick=${onClick} disabled=${!onClick} aria-label=${DOK.cardName(d)}>
    ${d.k !== 'n' && size !== 'sm' ? html`<span class="corner">${d.v}</span>` : null}
    <span class="num">${d.k === 'n' || size === 'sm' ? d.v : kindMark(d.k)}</span>
    ${d.k !== 'n' && size !== 'sm' ? html`<span class="lbl">${kind.label}</span>` : null}
  </button>`;
}
const kindMark = k => ({ gold: '金', lamp: '燈', eye: '眼', swap: '換', boss: '鬼' })[k];

function Rules({ onClose }) {
  const ex = k => html`<${Card} c="x" cards=${{ x: { k, v: DOK.KINDS[k]?.v ?? 3 } }} size="sm" />`;
  return html`<div class="overlay" onClick=${e => e.target === e.currentTarget && onClose()}><div class="sheet rules">
    <h2>도깨비 셈 규칙</h2>
    <p><b>목표:</b> 내 앞에 뒤집혀 있는 카드의 숫자 합을 <b>가장 낮게</b> 만드세요. 여러 라운드를 하고, 누군가 누적 ${DOK.GOAL}점이 넘으면 끝! 누적 점수가 가장 낮은 사람이 이겨요.</p>
    <h3>준비</h3>
    <ul><li>각자 카드 ${DOK.HAND}장을 뒤집어 받아요.</li><li>라운드가 시작되면 <b>왼쪽 2장만</b> 잠깐 볼 수 있어요. 잘 기억하세요! 나머지는 모르는 카드예요.</li></ul>
    <h3>내 차례에 할 수 있는 것 (하나만)</h3>
    <ul>
      <li><b>덱에서 뽑기</b> → 뽑은 카드를 내 카드 1장과 바꾸거나, 그냥 버려요. 특수 카드를 버리면 능력을 쓸 수 있어요.</li>
      <li><b>버림더미 가져오기</b> → 맨 위 카드를 가져와 반드시 내 카드 1장과 바꿔요.</li>
      <li><b>짝 버리기</b> → 내 카드 2장을 골라 공개해요. 숫자가 같으면 둘 다 버려서 카드가 줄어요! 다르면 다시 엎고 벌칙으로 카드 1장을 더 받아요.</li>
      <li><b>셈!</b> → "이제 끝!"을 외쳐요 (한 바퀴 돈 뒤부터). 다른 사람들이 한 번씩만 더 하고 라운드가 끝나요.</li>
    </ul>
    <h3>특수 카드 (덱에서 뽑아서 버릴 때만 능력 사용)</h3>
    <div class="legend">
      ${ex('lamp')}<span><b>등불 (5점)</b> 내 카드 1장 몰래 보기</span>
      ${ex('eye')}<span><b>도깨비 눈 (6점)</b> 다른 사람 카드 1장 몰래 보기</span>
      ${ex('swap')}<span><b>바꿔치기 (8점)</b> 내 카드 1장과 다른 사람 카드 1장을 안 보고 맞바꾸기</span>
      ${ex('gold')}<span><b>금방망이 (−3점)</b> 제일 좋은 카드</span>
      ${ex('boss')}<span><b>대장 도깨비 (12점)</b> 제일 나쁜 카드</span>
    </div>
    <p class="small muted">일반 카드: 0~9 (0은 4장, 1~9는 5장씩)</p>
    <h3>점수</h3>
    <ul><li>라운드가 끝나면 모두 공개하고 합계가 내 점수가 돼요.</li>
      <li><b>셈!을 외친 사람</b>이 가장 낮거나 같으면 <b>0점</b>. 아니면 합계 <b>+${DOK.CALL_PENALTY}점</b> 벌칙!</li></ul>
    <h3>팁</h3>
    <ul><li>몰래 본 카드는 3초만 보여요. 기억력 싸움이에요.</li><li>남이 버림더미에서 가져간 카드는 다 같이 봤으니 기억해 두세요.</li></ul>
    <div class="row" style="margin-top:16px"><button class="btn primary" style="flex:1" onClick=${onClose}>알겠어요</button></div>
  </div></div>`;
}

function App() {
  const [db, setDb] = useState(undefined);   // undefined: 연결 중, null: 사용 불가
  const [me, setMe] = useState({ id: null, name: '' });
  const [nick, setNick] = useState(() => ls.get('nick', ''));
  const [roomCode, setRoomCode] = useState(() => (location.hash.match(/^#room-([A-Z]{4})$/) || [])[1] || null);
  const [toast, setToast] = useState(null);
  const say = useCallback(m => { setToast(m); clearTimeout(say.t); say.t = setTimeout(() => setToast(null), 2600); }, []);

  useEffect(() => { (async () => {
    const [d, u] = await Promise.all([window.claude?.use?.('db') ?? null, window.claude?.use?.('user') ?? null]);
    if (u) { const m = await u.me(); setMe({ id: m.id, name: m.name }); if (!ls.get('nick', '') && m.name) setNick(m.name.split(' ')[0]); }
    setDb(d || null);
  })(); }, []);
  useEffect(() => { const f = () => setRoomCode((location.hash.match(/^#room-([A-Z]{4})$/) || [])[1] || null); addEventListener('hashchange', f); return () => removeEventListener('hashchange', f); }, []);
  const go = code => { location.hash = code ? 'room-' + code : ''; setRoomCode(code); };

  if (db === undefined) return html`<p class="muted">연결하는 중…</p>`;
  if (!db || !me.id) return html`<div class="stack"><header class="top"><h1>우리집 보드게임</h1></header>
    <div class="sheet"><h2>접속할 수 없어요</h2><p>같이 하려면 claude.ai에 로그인한 상태로 이 링크를 열어야 해요. 가족에게 링크를 공유할 때 <b>참여(편집 아님) 권한</b>으로 초대해 주세요.</p></div></div>`;
  return html`<div>
    ${roomCode ? html`<${Room} db=${db} me=${me} nick=${nick} code=${roomCode} leave=${() => go(null)} say=${say} />`
               : html`<${Hub} db=${db} me=${me} nick=${nick} setNick=${n => { setNick(n); ls.set('nick', n); }} go=${go} say=${say} />`}
    ${toast ? html`<div class="toast" role="status">${toast}</div>` : null}
  </div>`;
}

function Hub({ db, me, nick, setNick, go, say }) {
  const [rooms, setRooms] = useState(null);
  const [join, setJoin] = useState('');
  const [rules, setRules] = useState(false);
  useEffect(() => {
    const t = setTimeout(() => setRooms(r => r || []), 10000);
    const un = db.collection('rooms').orderBy('updatedAt', 'desc').limit(20).onSnapshot(s => { clearTimeout(t); setRooms(s.docs.map(d => d.data())); }, () => setRooms([]));
    return () => { clearTimeout(t); un(); };
  }, [db]);
  const create = async game => {
    if (!nick.trim()) return say('먼저 이름을 정해 주세요');
    const code = codeGen();
    try {
      await db.doc('rooms/' + code).set({ code, game, host: me.id, status: 'lobby', players: [{ id: me.id, nick: nick.trim() }], ver: 1, updatedAt: Date.now(), log: [] });
      go(code);
    } catch (e) { say('방을 만들지 못했어요: ' + (e.code || e.message)); }
  };
  const open = (rooms || []).filter(r => Date.now() - r.updatedAt < 864e5);
  return html`<div class="stack">
    <header class="top"><h1>우리집 보드게임</h1><button class="btn sm" onClick=${() => setRules(true)}>규칙</button></header>
    <label class="stack" style="gap:6px"><span class="small muted">내 이름 (가족이 보는 이름)</span>
      <input id="nick" value=${nick} maxLength="10" placeholder="예: 엄마, 아빠, 민지" onInput=${e => setNick(e.target.value)} /></label>
    ${GAMES.map(g => html`<div class="game-tile" key=${g.id}>
      <div class="art"><div class="row" style="gap:3px">
        <${Card} c="a" cards=${{ a: { k: 'n', v: 3 } }} size="sm" /><${Card} c="b" cards=${{ b: { k: 'swap', v: 8 } }} size="sm" /><${Card} hidden size="sm" /></div></div>
      <div class="stack" style="gap:6px;min-width:0"><h2>${g.name}</h2><span class="small muted">${g.who}</span><span class="small">${g.blurb}</span>
        <div class="row"><button class="btn primary sm" onClick=${() => create(g.id)}>새 방 만들기</button><button class="btn sm" onClick=${() => setRules(true)}>규칙 보기</button></div></div>
    </div>`)}
    <form class="row" onSubmit=${e => { e.preventDefault(); const c = join.trim().toUpperCase(); if (/^[A-Z]{4}$/.test(c)) go(c); else say('방 코드 4글자를 입력하세요'); }}>
      <input id="joincode" value=${join} maxLength="4" placeholder="방 코드 (예: KMTR)" onInput=${e => setJoin(e.target.value)} style="text-transform:uppercase" />
      <button class="btn jade" type="submit" style="white-space:nowrap">들어가기</button></form>
    <div class="stack" style="gap:8px"><span class="small muted">열려 있는 방</span>
      ${rooms === null ? html`<span class="small muted">불러오는 중…</span>` : open.length === 0 ? html`<span class="small muted">아직 방이 없어요. 위에서 새 방을 만들고 코드를 가족에게 알려 주세요.</span>` :
        open.map(r => html`<div class="room-item" key=${r.code}><span><b class="display" style="letter-spacing:2px;color:var(--moon)">${r.code}</b> · ${r.players.map(p => p.nick).join(', ')}</span>
          <span class="row"><span class="small muted">${{ lobby: '모집 중', play: '게임 중', roundEnd: '라운드 끝', gameEnd: '끝남' }[r.status]}</span><button class="btn sm" onClick=${() => go(r.code)}>입장</button></span></div>`)}
    </div>
    ${rules ? html`<${Rules} onClose=${() => setRules(false)} />` : null}
  </div>`;
}

function Room({ db, me, nick, code, leave, say }) {
  const [room, setRoom] = useState(undefined);
  const [busy, setBusy] = useState(false);
  const [rules, setRules] = useState(false);
  const ref = useMemo(() => db.doc('rooms/' + code), [db, code]);
  useEffect(() => {
    const t = setTimeout(() => setRoom(r => r === undefined ? null : r), 10000);
    const un = ref.onSnapshot(s => { if (!s.metadata.fromCache || s.exists) { clearTimeout(t); setRoom(s.exists ? s.data() : null); } }, () => setRoom(null));
    return () => { clearTimeout(t); un(); };
  }, [ref]);

  // 상태 쓰기: 최신 버전을 다시 읽어 확인 후 덮어씀 (차례인 사람만 쓰므로 충돌 드묾)
  const commit = async (fn) => {
    if (busy) return; setBusy(true);
    try {
      const snap = await ref.get(); const latest = snap.data();
      if (!latest) throw Error('방이 사라졌어요');
      const next = fn(latest); next.ver = (latest.ver || 0) + 1; next.updatedAt = Date.now();
      await ref.set(next);
    } catch (e) { say(e.message || '실패했어요'); }
    finally { setBusy(false); }
  };
  const act = (type, a) => commit(s => DOK.act(s, me.id, type, a));

  const joinRoom = async () => {
    if (!nick.trim()) return say('처음 화면에서 이름을 먼저 정해 주세요');
    setBusy(true);
    try {
      // 동시에 들어오는 가족끼리 서로 덮어쓰지 않도록 1초짜리 잠금을 잡고, 바쁘면 자동으로 다시 시도
      let l = { acquired: false };
      for (let t = 0; t < 8 && !l.acquired; t++) {
        l = await ref.acquire({ holder: me.id, ttlMs: 1000 });
        if (!l.acquired) await new Promise(r => setTimeout(r, 300 + Math.random() * 400));
      }
      if (!l.acquired) throw Error('다른 사람이 들어오는 중이에요. 다시 눌러 주세요');
      const s = (await ref.get()).data();
      if (s.status !== 'lobby') throw Error('이미 시작한 방이에요');
      if (s.players.length >= 6) throw Error('방이 가득 찼어요 (6명)');
      if (!s.players.some(p => p.id === me.id)) await ref.set({ ...s, players: s.players.concat({ id: me.id, nick: nick.trim() }), ver: s.ver + 1, updatedAt: Date.now() });
    } catch (e) { say(e.message); } finally { setBusy(false); }
  };

  if (room === undefined) return html`<p class="muted">방에 들어가는 중…</p>`;
  if (room === null) return html`<div class="stack"><div class="sheet"><h2>방을 찾을 수 없어요</h2><p>코드 <b>${code}</b> 방이 없거나 닫혔어요.</p>
    <button class="btn primary" onClick=${leave}>처음으로</button></div></div>`;
  const inRoom = room.players.some(p => p.id === me.id), isHost = room.host === me.id;
  const nameOf = id => (room.players.find(p => p.id === id) || {}).nick || '누군가';

  const header = html`<header class="top"><button class="btn sm ghost" onClick=${leave} aria-label="나가기">← 나가기</button>
    <span class="chip">방 코드 <b>${room.code}</b></span><button class="btn sm" onClick=${() => setRules(true)}>규칙</button></header>`;
  const rulesEl = rules ? html`<${Rules} onClose=${() => setRules(false)} />` : null;

  if (room.status === 'lobby') return html`<div class="stack">${header}
    <div class="sheet stack"><h2>도깨비 셈 · 모이는 중</h2>
      <p class="muted small">가족에게 방 코드 <b style="color:var(--moon)">${room.code}</b> 를 알려 주세요. 같은 링크를 열고 코드를 입력하면 들어와요.</p>
      <div class="stack" style="gap:6px">${room.players.map((p, i) => html`<div class="room-item" key=${p.id}><span>${i + 1}. ${p.nick}${p.id === me.id ? ' (나)' : ''}</span>${p.id === room.host ? html`<span class="small muted">방장</span>` : null}</div>`)}</div>
      ${!inRoom ? html`<button class="btn jade" disabled=${busy} onClick=${joinRoom}>이 방에 참가하기</button>` : null}
      ${isHost ? html`<button class="btn primary" disabled=${busy || room.players.length < 2} onClick=${() => commit(s => DOK.newRound(s))}>${room.players.length < 2 ? '2명 이상 모이면 시작할 수 있어요' : '게임 시작!'}</button>`
               : inRoom ? html`<p class="small muted">방장이 시작하기를 기다리는 중…</p>` : null}
      ${isHost ? html`<button class="btn sm ghost" onClick=${async () => { await ref.delete(); leave(); }}>방 닫기</button>` : null}
    </div>${rulesEl}</div>`;

  return html`<div>${header}<${Board} room=${room} me=${me} busy=${busy} act=${act} commit=${commit} nameOf=${nameOf} isHost=${isHost} say=${say} leave=${leave} ref=${ref} />${rulesEl}</div>`;
}

function Board({ room, me, busy, act, commit, nameOf, isHost, say, leave, ref }) {
  const s = room, myId = me.id, playing = s.players.some(p => p.id === myId);
  const myTurn = s.status === 'play' && DOK.cur(s) === myId;
  const [sel, setSel] = useState([]);          // 짝 버리기/바꿔치기 선택
  const [mode, setMode] = useState(null);      // 'pair'
  const [peek, setPeek] = useState(null);      // { card, until }
  const [initPeek, setInitPeek] = useState(false);
  const [revealSeen, setRevealSeen] = useState(null);
  const hand = s.hands[myId] || [];

  // 라운드 시작: 왼쪽 2장 보기 (이 폰에서만, 라운드마다 한 번)
  useEffect(() => {
    if (s.status !== 'play' || !playing) return;
    const k = `peek-${s.code}-${s.round}`;
    if (!ls.get(k, false)) setInitPeek(true);
  }, [s.round, s.status]);
  useEffect(() => { setSel([]); setMode(null); }, [s.ver]);
  // 짝 버리기 공개: 모두에게 3초 보여줌
  useEffect(() => { if (s.reveal && s.reveal.at !== revealSeen) { setRevealSeen(s.reveal.at); const r = s.reveal;
    setPeek({ cards: r.cards, title: `${nameOf(r.pid)}의 짝 버리기 ${r.ok ? '성공!' : '실패'}` }); setTimeout(() => setPeek(p => p && p.cards === r.cards ? null : p), 3000); } }, [s.reveal && s.reveal.at]);

  const showPeek = (cards, title) => { setPeek({ cards, title }); setTimeout(() => setPeek(null), 3000); };
  const ab = myTurn ? s.ability : null;
  const pend = myTurn ? s.pending : null;

  const tapMine = i => {
    if (!myTurn || busy) return;
    if (pend) return act('swapPending', { idx: i });
    if (ab?.type === 'peekSelf') { showPeek([hand[i]], `내 ${i + 1}번 카드`); return act('peekSelf', { idx: i }); }
    if (ab?.type === 'swap') return setSel(x => x[0] === i ? [] : [i]);
    if (mode === 'pair') return setSel(x => x.includes(i) ? x.filter(y => y !== i) : x.concat(i).slice(-2));
  };
  const tapOther = (pid, i) => {
    if (!myTurn || busy) return;
    if (ab?.type === 'peekOther') { showPeek([s.hands[pid][i]], `${nameOf(pid)}의 ${i + 1}번 카드`); return act('peekOther', { target: pid, idx: i }); }
    if (ab?.type === 'swap') { if (sel.length !== 1) return say('먼저 내 카드 1장을 고르세요'); return act('swapCards', { myIdx: sel[0], target: pid, idx: i }); }
  };
  const mineSelectable = myTurn && (pend || ab?.type === 'peekSelf' || ab?.type === 'swap' || mode === 'pair');
  const othersSelectable = myTurn && (ab?.type === 'peekOther' || (ab?.type === 'swap' && sel.length === 1));

  let status;
  if (s.status === 'roundEnd' || s.status === 'gameEnd') status = s.status === 'gameEnd' ? '게임이 끝났어요!' : `${s.round}라운드가 끝났어요`;
  else if (!myTurn) status = `${nameOf(DOK.cur(s))}의 차례${s.caller ? ` · ${nameOf(s.caller)}가 셈을 외쳤어요` : ''}`;
  else if (pend) status = pend.from === 'deck' ? '내 카드를 눌러 바꾸거나, 버리세요' : '바꿀 내 카드를 누르세요';
  else if (ab?.type === 'peekSelf') status = '몰래 볼 내 카드를 누르세요';
  else if (ab?.type === 'peekOther') status = '몰래 볼 다른 사람 카드를 누르세요';
  else if (ab?.type === 'swap') status = sel.length ? '이제 맞바꿀 다른 사람 카드를 누르세요' : '맞바꿀 내 카드를 먼저 누르세요';
  else if (mode === 'pair') status = `짝으로 버릴 카드 2장을 고르세요 (${sel.length}/2)`;
  else status = '내 차례예요! 무엇을 할까요?';

  const pk = pend ? s.cards[pend.card] : null, pkKind = pk ? DOK.KINDS[pk.k] : null;
  const topDiscard = s.discard[s.discard.length - 1];
  const others = s.players.filter(p => p.id !== myId);
  const renderLog = t => t.replace(/\{([^}]+)\}/g, (_, id) => nameOf(id));

  return html`<div class="stack">
    <div class="opps">${others.map(p => html`<div key=${p.id} class=${'opp' + (s.status === 'play' && DOK.cur(s) === p.id ? ' turn' : '')}>
      <div class="row" style="justify-content:space-between"><span class="name"><span>${p.nick}</span>${s.caller === p.id ? html`<span class="chip">셈!</span>` : null}</span>
        <span class="small">누적 <span class="score">${s.scores?.[p.id] ?? 0}</span></span></div>
      <div class="cards-row">${(s.hands[p.id] || []).map((c, i) => html`<${Card} key=${c} c=${c} cards=${s.cards} size="sm" hidden=${s.status === 'play'}
        selectable=${othersSelectable} onClick=${othersSelectable ? () => tapOther(p.id, i) : null} />`)}</div>
    </div>`)}</div>

    <div class="table">
      <div class="pile"><${Card} hidden size="lg" onClick=${myTurn && !pend && !ab && !mode && !busy ? () => act('draw') : null} selectable=${myTurn && !pend && !ab && !mode} />
        <span class="cap">덱 ${s.deck.length}장</span></div>
      ${s.pending ? html`<div class="pile"><${Card} c=${s.pending.card} cards=${s.cards} size="lg" hidden=${!myTurn && s.pending.from === 'deck'} flash />
        <span class="cap">${myTurn ? '가져온 카드' : `${nameOf(DOK.cur(s))}가 든 카드`}</span></div>` : null}
      <div class="pile"><${Card} c=${topDiscard} cards=${s.cards} size="lg" onClick=${myTurn && !pend && !ab && !mode && topDiscard && hand.length && !busy ? () => act('takeDiscard') : null}
        selectable=${myTurn && !pend && !ab && !mode && !!topDiscard && hand.length > 0} /><span class="cap">버림더미</span></div>
    </div>

    <div class="status" role="status">${status}</div>

    ${playing ? html`<div class=${'me' + (myTurn ? ' turn' : '')}>
      <div class="row" style="justify-content:space-between"><b>${nameOf(myId)} (나)</b><span class="small">누적 <span class="score">${s.scores?.[myId] ?? 0}</span></span></div>
      <div class="cards-row">${hand.map((c, i) => html`<${Card} key=${c} c=${c} cards=${s.cards} hidden=${s.status === 'play'} selectable=${mineSelectable}
        selected=${sel.includes(i)} onClick=${mineSelectable ? () => tapMine(i) : null} />`)}</div>

      ${myTurn ? html`<div class="actions">
        ${pend && pend.from === 'deck' ? html`
          ${pkKind.ability ? html`<button class="btn primary wide" disabled=${busy} onClick=${() => act('discardPending', { useAbility: true })}>버리고 능력 쓰기: ${pkKind.desc.replace('버리면: ', '')}</button>` : null}
          <button class="btn wide" disabled=${busy} onClick=${() => act('discardPending', { useAbility: false })}>그냥 버리기</button>` : null}
        ${ab ? html`<button class="btn wide" disabled=${busy} onClick=${() => act('skipAbility')}>능력 쓰지 않기</button>` : null}
        ${!pend && !ab && mode !== 'pair' ? html`
          <button class="btn jade" disabled=${busy} onClick=${() => act('draw')}>덱에서 뽑기</button>
          <button class="btn" disabled=${busy || !topDiscard || !hand.length} onClick=${() => act('takeDiscard')}>버림더미 가져오기</button>
          <button class="btn" disabled=${busy || hand.length < 2} onClick=${() => { setMode('pair'); setSel([]); }}>짝 버리기</button>
          <button class="btn primary" disabled=${busy || !!s.caller || s.turnsPlayed < s.players.length} onClick=${() => act('call')}>셈! (끝내기)</button>` : null}
        ${mode === 'pair' ? html`<button class="btn" onClick=${() => { setMode(null); setSel([]); }}>취소</button>
          <button class="btn primary" disabled=${busy || sel.length !== 2} onClick=${() => act('pair', { idx: sel })}>공개해서 버리기</button>` : null}
      </div>` : null}
    </div>` : html`<p class="muted small" style="text-align:center">구경 중이에요. 다음 게임부터 참가할 수 있어요.</p>`}

    <div class="log">${(s.log || []).slice(0, 5).map((l, i) => html`<div key=${i}>${l.who ? html`<b>${nameOf(l.who)}</b> ` : null}${renderLog(l.text)}</div>`)}</div>

    ${initPeek ? html`<div class="overlay"><div class="sheet stack" style="text-align:center">
      <h2>${s.round}라운드 · 내 왼쪽 카드 2장</h2><p class="muted small">이 두 장만 볼 수 있어요. 잘 기억하세요!</p>
      <div class="row" style="justify-content:center;gap:12px">${hand.slice(0, 2).map(c => html`<${Card} key=${c} c=${c} cards=${s.cards} size="lg" flash />`)}</div>
      <div class="row" style="justify-content:center;gap:12px;color:var(--muted)"><span>1번</span><span style="width:60px"></span><span>2번</span></div>
      <button class="btn primary" onClick=${() => { ls.set(`peek-${s.code}-${s.round}`, true); setInitPeek(false); }}>기억했어요</button></div></div>` : null}

    ${peek ? html`<div class="overlay" onClick=${() => setPeek(null)}><div class="sheet stack" style="text-align:center"><h2>${peek.title}</h2>
      <div class="row" style="justify-content:center;gap:12px">${peek.cards.map(c => html`<${Card} key=${c} c=${c} cards=${s.cards} size="lg" flash />`)}</div>
      <p class="small muted">3초 뒤에 사라져요</p></div></div>` : null}

    ${(s.status === 'roundEnd' || s.status === 'gameEnd') ? html`<${Result} s=${s} myId=${myId} nameOf=${nameOf} isHost=${isHost} busy=${busy}
      next=${() => commit(st => DOK.newRound(st))} again=${() => commit(st => DOK.newRound({ ...st, scores: null, round: 0 }))} close=${async () => { await ref.delete(); leave(); }} />` : null}
  </div>`;
}

function Result({ s, myId, nameOf, isHost, busy, next, again, close }) {
  const order = s.players.slice().sort((a, b) => s.scores[a.id] - s.scores[b.id]);
  const over = s.status === 'gameEnd';
  return html`<div class="overlay"><div class="sheet stack">
    <h2>${over ? `🏆 ${nameOf(order[0].id)} 우승!` : `${s.round}라운드 결과`}</h2>
    ${s.caller ? html`<p class="small">${nameOf(s.caller)}의 셈! ${s.result.callerWon ? '성공 — 0점' : `실패 — +${DOK.CALL_PENALTY}점 벌칙`}</p>` : null}
    ${s.players.map(p => html`<div key=${p.id} class="stack" style="gap:4px"><span class="small"><b>${p.nick}</b> · 합계 ${s.result.sums[p.id]}</span>
      <div class="cards-row" style="margin:0">${(s.hands[p.id] || []).map(c => html`<${Card} key=${c} c=${c} cards=${s.cards} size="sm" />`)}</div></div>`)}
    <table class="result"><thead><tr><th>이름</th><th>이번 라운드</th><th>누적</th></tr></thead><tbody>
      ${order.map(p => html`<tr key=${p.id}><td>${p.nick}${p.id === myId ? ' (나)' : ''}</td><td>+${s.result.add[p.id]}</td><td class="score">${s.scores[p.id]}</td></tr>`)}</tbody></table>
    <p class="small muted">누군가 누적 ${DOK.GOAL}점을 넘으면 게임이 끝나고, 가장 낮은 사람이 이겨요.</p>
    ${isHost ? (over ? html`<div class="row"><button class="btn primary" style="flex:1" disabled=${busy} onClick=${again}>새 게임</button><button class="btn" onClick=${close}>방 닫기</button></div>`
                     : html`<button class="btn primary" disabled=${busy} onClick=${next}>다음 라운드</button>`)
             : html`<p class="small muted">방장이 ${over ? '새 게임을' : '다음 라운드를'} 시작하기를 기다려요</p>`}
  </div></div>`;
}

ReactDOM.createRoot(document.getElementById('app')).render(html`<${App} />`);
</script>
