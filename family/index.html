  .pc.red { color: #c0283c; } .pc .r { font-size: calc(var(--w) * .32); line-height: 1; } .pc .s { font-size: calc(var(--w) * .42); align-self: center; justify-self: center; line-height: 1; }
  .pc.joker { background: linear-gradient(135deg, #ffd76a, #f07a3e); color: #2a1206; } .pc.joker.mono { background: linear-gradient(135deg, #e6e3f5, #8d88b8); }
  .pc.lg { --w: 78px; } .pc.sm { --w: 32px; padding: 2px 3px; } .pc.md { --w: 58px; }
  .pc.pic { grid-template-rows: auto 1fr auto; }
  .pc .cr { font-size: calc(var(--w) * .22); line-height: 1; display: flex; gap: 1px; align-items: baseline; }
  .pc img { width: 86%; justify-self: center; align-self: center; min-height: 0; }
  .pc .hint { font-family: var(--f-body); font-weight: 700; font-size: calc(var(--w) * .16); line-height: 1.1; text-align: center; color: #6b2a10; }
  .pc.red .hint { color: #8a1428; }

  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .gcard { display: grid; grid-template-columns: 56px 1fr; gap: 8px; align-items: center; padding: 8px; border-radius: 12px; background: rgba(255,255,255,.05); border: 1px solid var(--line); }
  .gcard img { width: 56px; height: 56px; }
  .gcard b { display: block; } .gcard span { font-size: 12px; color: #ddd8f5; line-height: 1.35; }
  .pc.back { background: repeating-linear-gradient(45deg, #3a2f78 0 5px, #332a6b 5px 10px); border-color: #5b4fb0; }
  .pc.sel { transform: translateY(-10px); box-shadow: 0 0 0 3px var(--moon); }
  .pc.can { box-shadow: 0 0 0 2px var(--jade); }
  .pc.dim { opacity: .45; }
  .fan { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; padding-top: 10px; }
  .pc-btn { padding: 0; background: none; border: 0; border-radius: 7px; transition: transform .15s; }
  /* 도깨비 방망이 타일 */
  .tile { --w: 34px; width: var(--w); height: calc(var(--w) * 1.3); border-radius: 6px; background: #fbf8f1; display: grid; place-items: center;
    font-family: var(--f-display); font-size: calc(var(--w) * .58); border: 1.5px solid #d6cdb8; box-shadow: 0 2px 0 #b9ae95; flex: 0 0 auto; padding: 0; }
  .tile.c0 { color: #2b6fd6; } .tile.c1 { color: #d33a3a; } .tile.c2 { color: #c99400; } .tile.c3 { color: #8a8a8a; } .tile.c4 { color: #1d1b2e; }
  .tile.wild { background: linear-gradient(135deg, #ffd76a, #f07a3e); color: #2a1206; }
  .tile.sel { transform: translateY(-6px); box-shadow: 0 0 0 3px var(--moon); }
  .tile.staged { outline: 2px dashed var(--jade); }
  .meld { display: flex; gap: 3px; padding: 6px; border-radius: 10px; background: rgba(255,255,255,.04); border: 1px solid var(--line); flex-wrap: wrap; }
  .meld.pick { border-color: var(--jade); cursor: pointer; }
  /* 공방 재료 */
  .res { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 13px; font-weight: 700; font-size: 13px; box-sizing: border-box; color: #1d1b2e; }
  .res.wood { background: #8fd17a; } .res.clay { background: #e89b6a; } .res.iron { background: #a9b7cc; } .res.silk { background: #e6a6e0; }
  .wcard { padding: 10px; border-radius: 12px; background: var(--hanji); color: var(--ink); display: grid; gap: 6px; text-align: left; border: 2px solid transparent; }
  .wcard.can { border-color: var(--jade); } .wcard:disabled { opacity: .8; } .wcard h4 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 16px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  /* 역할 카드 */

  .plist { display: grid; gap: 6px; }
  .pbtn { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--night-2); border: 1px solid var(--line); text-align: left; width: 100%; }
  .pbtn.on { border-color: var(--moon); box-shadow: 0 0 0 1px var(--moon); } .pbtn.dead { opacity: .45; text-decoration: line-through; }
</style>

<script>
'use strict';
/* 공통 도구: 모든 게임 파일이 함께 씀 */
const { useState, useEffect, useRef, useMemo, useCallback } = React;
const toStyle = str => Object.fromEntries(str.split(';').map(d => d.trim()).filter(Boolean).map(d => {
  const i = d.indexOf(':'); const k = d.slice(0, i).trim(); return [k.startsWith('--') ? k : k.replace(/-([a-z])/g, (_, c) => c.toUpperCase()), d.slice(i + 1).trim()]; }));
const h = (type, props, ...kids) => {
  if (props) {
    if (typeof props.style === 'string') props = { ...props, style: toStyle(props.style) };
    if ('class' in props) { const { class: c, ...rest } = props; props = { ...rest, className: c }; }
  }
  return React.createElement(type, props, ...kids);
};
const html = htm.bind(h);
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const GAMES = [];
// 받침에 맞는 조사: josa('나무', '을', '를') → '나무를'
const josa = (w, withB, noB) => { w = String(w); const c = w.charCodeAt(w.length - 1);
  if (c < 0xAC00 || c > 0xD7A3) return w + withB + '(' + noB + ')'; return w + ((c - 0xAC00) % 28 ? withB : noB); };
const clone = o => JSON.parse(JSON.stringify(o));
const shuffle = (a, rnd = Math.random) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pushLog = (s, who, text) => { s.log = [{ who, text }].concat(s.log || []).slice(0, 8); };
const Overlay = ({ children, onClose }) => html`<div class="overlay" onClick=${e => onClose && e.target === e.currentTarget && onClose()}><div class="sheet stack">${children}</div></div>`;
function LogList({ log, nameOf }) {
  const fill = t => t.replace(/\{([^}]+)\}/g, (_, id) => nameOf(id));
  return html`<div class="log">${(log || []).slice(0, 5).map((l, i) => html`<div key=${i}>${l.who ? html`<b>${nameOf(l.who)}</b> ` : null}${fill(l.text)}</div>`)}</div>`;
}
// 트럼프 카드: id 형식 "S10", "HA", "JK1"(컬러 조커) "JK0"(흑백 조커)
const SUITS = { S: '♠', H: '♥', D: '♦', C: '♣' };
// 그림 카드: J=도깨비 졸개, Q=구미호, K=대장 도깨비, A=도깨비불, 조커=청룡(컬러)·저승사자(흑백)
const FACE = { J: 'dokkaebi', Q: 'gumiho', K: 'bigdok', A: 'wisp' };
const FACE_NAME = { J: '도깨비 졸개', Q: '구미호', K: '대장 도깨비', A: '도깨비불', JK1: '청룡 조커', JK0: '저승사자 조커' };
function PCard({ id, size, back, sel, can, dim, onClick, hint }) {
  let inner, cls = 'pc ' + (size || '');
  if (back || !id) { cls += ' back'; inner = null; }
  else if (id.startsWith('JK')) { cls += ' joker pic' + (id === 'JK0' ? ' mono' : '');
    inner = html`<span class="cr">JK</span><img src=${ARTURL(id === 'JK0' ? 'reaper' : 'dragon')} alt="" />${hint ? html`<span class="hint">${hint}</span>` : null}`; }
  else { const su = id[0], r = id.slice(1); if (su === 'H' || su === 'D') cls += ' red';
    if (FACE[r]) { cls += ' pic'; inner = html`<span class="cr">${r}<small>${SUITS[su]}</small></span><img src=${ARTURL(FACE[r])} alt="" />${hint ? html`<span class="hint">${hint}</span>` : null}`; }
    else inner = html`<span class="r">${r}</span><span class="s">${SUITS[su]}</span>${hint ? html`<span class="hint">${hint}</span>` : null}`; }
  if (sel) cls += ' sel'; if (can) cls += ' can'; if (dim) cls += ' dim';
  const el = html`<span class=${cls} aria-label=${id ? (FACE_NAME[id] || FACE_NAME[id.slice(1)] || id) + (hint ? ' · ' + hint : '') : '뒷면'}>${inner}</span>`;
  return onClick ? html`<button type="button" class="pc-btn" onClick=${onClick}>${el}</button>` : el;
}
</script>

<script>
'use strict';
/* 앱 틀: 허브 · 방 · 로비 (게임은 GAMES 에 등록된 모듈이 그림) */
const codeGen = () => Array.from({ length: 4 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random() * 24)]).join('');
const gameOf = id => GAMES.find(g => g.id === id);

function App() {
  const [db, setDb] = useState(undefined);
  const [me, setMe] = useState({ id: null, name: '' });
  const [nick, setNick] = useState(() => ls.get('nick', ''));
  const parse = () => (location.hash.match(/^#room-([A-Z]{4})$/) || [])[1] || null;
  const [roomCode, setRoomCode] = useState(parse);
  const [toast, setToast] = useState(null);
  const say = useCallback(m => { setToast(m); clearTimeout(say.t); say.t = setTimeout(() => setToast(null), 2600); }, []);
  useEffect(() => { (async () => {
    const [d, u] = await Promise.all([window.claude?.use?.('db') ?? null, window.claude?.use?.('user') ?? null]);
    if (u) { const m = await u.me(); setMe({ id: m.id, name: m.name }); if (!ls.get('nick', '') && m.name) setNick(m.name.split(' ')[0]); }
    setDb(d || null);
  })(); }, []);
  useEffect(() => { const f = () => setRoomCode(parse()); addEventListener('hashchange', f); return () => removeEventListener('hashchange', f); }, []);
  const go = code => { location.hash = code ? 'room-' + code : ''; setRoomCode(code); };
  if (db === undefined) return html`<p class="muted">연결하는 중…</p>`;
  if (!db || !me.id) return html`<div class="stack"><header class="top"><h1>도깨비</h1></header>
    <div class="sheet"><h2>접속할 수 없어요</h2><p>같이 하려면 claude.ai에 로그인한 상태로 이 링크를 열어야 해요. 링크를 공유할 때 보기 전용이 아니라 <b>참여할 수 있는 권한</b>으로 초대해 주세요.</p></div></div>`;
  return html`<div>
    ${roomCode ? html`<${Room} db=${db} me=${me} nick=${nick} code=${roomCode} leave=${() => go(null)} say=${say} />`
               : html`<${Hub} db=${db} me=${me} nick=${nick} setNick=${n => { setNick(n); ls.set('nick', n); }} go=${go} say=${say} />`}
    ${toast ? html`<div class="toast" role="status">${toast}</div>` : null}
  </div>`;
}

function Hub({ db, me, nick, setNick, go, say }) {
  const [rooms, setRooms] = useState(null);
  const [join, setJoin] = useState('');
  const [rulesOf, setRulesOf] = useState(null);
  useEffect(() => {
    const t = setTimeout(() => setRooms(r => r || []), 10000);
    const un = db.collection('rooms').orderBy('updatedAt', 'desc').limit(30).onSnapshot(s => { clearTimeout(t); setRooms(s.docs.map(d => d.data())); }, () => setRooms([]));
    return () => { clearTimeout(t); un(); };
  }, [db]);
  const create = async game => {
    if (!nick.trim()) return say('먼저 이름을 정해 주세요');
    const code = codeGen();
    try { await db.doc('rooms/' + code).set({ code, game, host: me.id, status: 'lobby', players: [{ id: me.id, nick: nick.trim() }], ver: 1, updatedAt: Date.now(), log: [] }); go(code); }
    catch (e) { say('방을 만들지 못했어요: ' + (e.code || e.message)); }
  };
  const open = (rooms || []).filter(r => Date.now() - r.updatedAt < 864e5);
  const R = rulesOf && gameOf(rulesOf);
  return html`<div class="stack">
    <header class="top"><div><h1>도깨비</h1><span class="small muted">우리 가족 놀이판 · 게임을 골라 방을 만드세요</span></div></header>
    <label class="stack" style="gap:6px"><span class="small muted">내 이름 (가족이 보는 이름)</span>
      <input id="nick" value=${nick} maxLength="10" placeholder="예: 엄마, 아빠, 민지" onInput=${e => setNick(e.target.value)} /></label>
    <form class="row" onSubmit=${e => { e.preventDefault(); const c = join.trim().toUpperCase(); if (/^[A-Z]{4}$/.test(c)) go(c); else say('방 코드 4글자를 입력하세요'); }}>
      <input id="joincode" value=${join} maxLength="4" placeholder="방 코드로 들어가기 (예: KMTR)" onInput=${e => setJoin(e.target.value)} style="text-transform:uppercase" />
      <button class="btn jade" type="submit" style="white-space:nowrap">들어가기</button></form>
    ${open.length ? html`<div class="stack" style="gap:8px"><span class="small muted">열려 있는 방</span>
      ${open.map(r => html`<div class="room-item" key=${r.code}><span style="min-width:0"><b class="display" style="letter-spacing:2px;color:var(--moon)">${r.code}</b> · ${gameOf(r.game)?.name || ''}<br/><span class="small muted">${r.players.map(p => p.nick).join(', ')}</span></span>
        <span class="row"><span class="small muted">${r.status === 'lobby' ? '모집 중' : '게임 중'}</span><button class="btn sm" onClick=${() => go(r.code)}>입장</button></span></div>`)}</div>` : null}
    <span class="small muted">게임 고르기</span>
    ${GAMES.map(g => html`<div class="game-tile" key=${g.id}>
      <div class="art">${g.Icon ? html`<${g.Icon} />` : null}</div>
      <div class="stack" style="gap:6px;min-width:0"><h2>${g.name}</h2><span class="small muted">${g.who}</span><span class="small">${g.blurb}</span>
        <div class="row"><button class="btn primary sm" onClick=${() => create(g.id)}>새 방 만들기</button><button class="btn sm" onClick=${() => setRulesOf(g.id)}>규칙</button></div></div>
    </div>`)}
    ${R ? html`<${R.Rules} onClose=${() => setRulesOf(null)} />` : null}
  </div>`;
}

function Room({ db, me, nick, code, leave, say }) {
  const [room, setRoom] = useState(undefined);
  const [busy, setBusy] = useState(false);
  const [rules, setRules] = useState(false);
  const ref = useMemo(() => db.doc('rooms/' + code), [db, code]);
  useEffect(() => {
    const t = setTimeout(() => setRoom(r => r === undefined ? null : r), 10000);
    const un = ref.onSnapshot(s => { if (!s.metadata.fromCache || s.exists) { clearTimeout(t); setRoom(s.exists ? s.data() : null); } }, () => setRoom(null));
    return () => { clearTimeout(t); un(); };
  }, [ref]);
  const game = room && gameOf(room.game);
  // 차례인 사람이 쓰는 전체 상태 쓰기: 최신 상태를 다시 읽고 규칙 엔진을 돌려 덮어씀
  const commit = async fn => {
    if (busy) return false; setBusy(true);
    try {
      const latest = (await ref.get()).data(); if (!latest) throw Error('방이 사라졌어요');
      const next = fn(latest); if (!next) return false;
      next.ver = (latest.ver || 0) + 1; next.updatedAt = Date.now(); await ref.set(next); return true;
    } catch (e) { say(e.message || '실패했어요'); return false; } finally { setBusy(false); }
  };
  // 여러 사람이 동시에 내는 것(밤 행동·투표): 내 칸만 합쳐 쓰기
  const patch = async obj => { try { await ref.update({ ...obj, updatedAt: Date.now() }); return true; } catch (e) { say(e.message || '실패했어요'); return false; } };
  const act = (type, a) => commit(s => gameOf(s.game).act(s, me.id, type, a));
  const close = async () => { await ref.delete(); leave(); };
  const restart = () => commit(s => gameOf(s.game).start({ code: s.code, game: s.game, host: s.host, players: s.players, ver: s.ver, log: [] }));
  const joinRoom = async () => {
    if (!nick.trim()) return say('처음 화면에서 이름을 먼저 정해 주세요');
    setBusy(true);
    try {
      let l = { acquired: false };
      for (let t = 0; t < 8 && !l.acquired; t++) { l = await ref.acquire({ holder: me.id, ttlMs: 1000 }); if (!l.acquired) await new Promise(r => setTimeout(r, 300 + Math.random() * 400)); }
      if (!l.acquired) throw Error('다른 사람이 들어오는 중이에요. 다시 눌러 주세요');
      const s = (await ref.get()).data();
      if (s.status !== 'lobby') throw Error('이미 시작한 방이에요');
      if (s.players.length >= gameOf(s.game).max) throw Error('방이 가득 찼어요');
      if (!s.players.some(p => p.id === me.id)) await ref.set({ ...s, players: s.players.concat({ id: me.id, nick: nick.trim() }), ver: s.ver + 1, updatedAt: Date.now() });
    } catch (e) { say(e.message); } finally { setBusy(false); }
  };
  if (room === undefined) return html`<p class="muted">방에 들어가는 중…</p>`;
  if (room === null || !game) return html`<div class="stack"><div class="sheet"><h2>방을 찾을 수 없어요</h2><p>코드 <b>${code}</b> 방이 없거나 닫혔어요.</p>
    <button class="btn primary" onClick=${leave}>처음으로</button></div></div>`;
  const inRoom = room.players.some(p => p.id === me.id), isHost = room.host === me.id;
  const nameOf = id => (room.players.find(p => p.id === id) || {}).nick || '누군가';
  const header = html`<header class="top"><button class="btn sm ghost" onClick=${leave}>← 나가기</button>
    <span class="chip">${game.name} <b>${room.code}</b></span><button class="btn sm" onClick=${() => setRules(true)}>규칙</button></header>`;
  const rulesEl = rules ? html`<${game.Rules} onClose=${() => setRules(false)} />` : null;
  if (room.status === 'lobby') return html`<div class="stack">${header}
    <div class="sheet stack"><h2>${game.name} · 모이는 중</h2>
      <p class="muted small">가족에게 방 코드 <b style="color:var(--moon)">${room.code}</b>를 알려 주세요. (${game.who})</p>
      <div class="stack" style="gap:6px">${room.players.map((p, i) => html`<div class="room-item" key=${p.id}><span>${i + 1}. ${p.nick}${p.id === me.id ? ' (나)' : ''}</span>${p.id === room.host ? html`<span class="small muted">방장</span>` : null}</div>`)}</div>
      ${!inRoom ? html`<button class="btn jade" disabled=${busy} onClick=${joinRoom}>이 방에 참가하기</button>` : null}
      ${isHost ? html`<button class="btn primary" disabled=${busy || room.players.length < game.min} onClick=${() => commit(s => gameOf(s.game).start(s))}>${room.players.length < game.min ? `${game.min}명 이상 모이면 시작할 수 있어요` : '게임 시작!'}</button>`
               : inRoom ? html`<p class="small muted">방장이 시작하기를 기다리는 중…</p>` : null}
      ${isHost ? html`<button class="btn sm ghost" onClick=${close}>방 닫기</button>` : null}
    </div>${rulesEl}</div>`;
  const B = game.Board;
  return html`<div>${header}<${B} room=${room} me=${me} busy=${busy} act=${act} commit=${commit} patch=${patch} nameOf=${nameOf} isHost=${isHost} say=${say} close=${close} restart=${restart} />${rulesEl}</div>`;
}

ReactDOM.createRoot(document.getElementById('app')).render(html`<${App} />`);
</script>
